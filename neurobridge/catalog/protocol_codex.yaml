id_scheme: codex T01..T64 (8 modules A-H); distinct from NeuroBridge T001..T708
n_cards: 64
cards:
- id: T01
  title: Eyes-open fixation baseline
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 60 s
  participant_instruction: Look gently at the central mark. Sit comfortably with a relaxed face
  stored_task_label: quality_control/eyes_open
  post-task_response: 'After offset: Were you awake, comfortable, and able to keep looking at the mark?'
  expected_answer_or_ground_truth: Self-report only
  stimulus: A small static + on a neutral background.
  protocol_note: Use the middle 50 s for baseline summaries. Log spontaneous blinks; do not discard the
    entire trial solely because one blink occurs.
- id: T02
  title: Eyes-closed baseline
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 45 s
  participant_instruction: Close your eyes gently and stay awake. Open them only after the end signal
  stored_task_label: quality_control/eyes_closed
  post-task_response: 'After opening your eyes: Were you awake throughout?'
  expected_answer_or_ground_truth: Self-report only
  stimulus: No changing visual stimulus. Give the end signal after the recorded interval.
  protocol_note: Log actual closure/opening if available; exclude 5 s at each edge. A spectral difference
    is not a universal relaxation score.
- id: T03
  title: Blink artifact examples
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 30 s
  participant_instruction: At each cue, blink once naturally, then relax
  stored_task_label: artifact_calibration/blink
  post-task_response: How many requested blinks did you complete? Did any others occur?
  expected_answer_or_ground_truth: Requested count 5; actual completion is reported
  stimulus: Five small cue markers at 5, 10, 15, 20, and 25 s.
  protocol_note: Record cue times separately from observed blink times. Use these to characterize contamination,
    not to train a cognitive command.
- id: T04
  title: Gaze-shift artifact examples
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 30 s
  participant_instruction: At each cue, briefly look left, return to center, then look right and return.
    Keep your head still
  stored_task_label: artifact_calibration/gaze
  post-task_response: Did you complete the gaze shifts? Did your head move?
  expected_answer_or_ground_truth: Self-report or observation
  stimulus: Five identical cue markers at 5, 10, 15, 20, and 25 s.
  protocol_note: Annotate the entire movement interval; eye movements can dominate a headband recording.
- id: T05
  title: Jaw-muscle artifact examples
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 30 s
  participant_instruction: At each cue, gently press your teeth together for about one second, then fully
    relax. Skip if uncomfortable
  stored_task_label: artifact_calibration/jaw
  post-task_response: How many gentle jaw actions did you complete?
  expected_answer_or_ground_truth: Requested count 5; actual completion is reported
  stimulus: Five identical cue markers at 5, 10, 15, 20, and 25 s.
  protocol_note: No forceful clenching. Treat increased high-frequency activity as possible muscle contamination,
    not evidence of concentration.
- id: T06
  title: Actual left-finger movement
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 30 s
  participant_instruction: At each cue, lightly tap one left-hand finger once; keep your face relaxed
  stored_task_label: artifact_calibration/left_movement
  post-task_response: How many taps did you complete?
  expected_answer_or_ground_truth: Requested count 5; actual completion is reported
  stimulus: Five identical cue markers at 5, 10, 15, 20, and 25 s.
  protocol_note: This is actual movement, not motor imagery. A signal difference may be movement or electrode
    artifact.
- id: T07
  title: Actual right-finger movement
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 30 s
  participant_instruction: At each cue, lightly tap one right-hand finger once; keep your face relaxed
  stored_task_label: artifact_calibration/right_movement
  post-task_response: How many taps did you complete?
  expected_answer_or_ground_truth: Requested count 5; actual completion is reported
  stimulus: Five identical cue markers at 5, 10, 15, 20, and 25 s.
  protocol_note: Match T06 cues and posture; preserve all movement annotations.
- id: T08
  title: Unstructured quiet baseline
  module: A
  module_name: Recording quality and artifacts
  type_task_duration: calibration / 60 s
  participant_instruction: Rest with your eyes open. Let thoughts come and go without performing a special
    mental task
  stored_task_label: quality_control/quiet_rest
  post-task_response: 'After offset: Describe your state as quiet, distracted, sleepy, or unsure'
  expected_answer_or_ground_truth: Self-report only
  stimulus: The same static + as T01.
  protocol_note: This is a comparison with instructed fixation, not a known empty mind. Repeat a short
    quiet baseline at session boundaries.
- id: T09
  title: Read about water
  module: B
  module_name: Reading and text controls
  type_task_duration: text / 12 s
  participant_instruction: Read silently once, then keep the scene in mind until the text disappears
  stored_task_label: presented_concept/water
  post-task_response: 'Which topic best fits: water, fire, dog, piano, or other?'
  expected_answer_or_ground_truth: water
  stimulus: 'Variant A: A narrow stream passes over smooth stones. Clear water bends around a fallen branch,
    forms a small pool, and continues toward the shaded bank. Variant B: Water flows through a shallow
    channel beside the path. It divides around three rocks, joins again, and moves steadily beyond a low
    wooden bridge.'
  protocol_note: Alternate passages evenly within days. The answer checks comprehension; the stimulus
    label is not an inferred thought.
- id: T10
  title: Read about fire
  module: B
  module_name: Reading and text controls
  type_task_duration: text / 12 s
  participant_instruction: Read silently once, then keep the scene in mind until the text disappears
  stored_task_label: presented_concept/fire
  post-task_response: 'Which topic best fits: water, fire, dog, piano, or other?'
  expected_answer_or_ground_truth: fire
  stimulus: 'Variant A: A small fire burns inside a stone fireplace. Orange flames rise around a short
    log, and a few glowing embers settle beneath the grate. Variant B: The fireplace holds two dry logs
    above a bed of embers. A flame briefly leans to one side, then rises while the wood slowly darkens.'
  protocol_note: ''
- id: T11
  title: Read about a dog
  module: B
  module_name: Reading and text controls
  type_task_duration: text / 12 s
  participant_instruction: Read silently once, then keep the scene in mind until the text disappears
  stored_task_label: presented_concept/dog
  post-task_response: 'Which topic best fits: water, fire, dog, piano, or other?'
  expected_answer_or_ground_truth: dog
  stimulus: 'Variant A: A dog waits beside a closed garden gate. It turns toward a familiar voice, lifts
    its ears, and walks back to the person holding its lead. Variant B: The dog carries a worn ball across
    the lawn. It places the ball near a chair, steps back, and watches the person seated in the shade.'
  protocol_note: ''
- id: T12
  title: Read about a piano
  module: B
  module_name: Reading and text controls
  type_task_duration: text / 12 s
  participant_instruction: Read silently once, then keep the scene in mind until the text disappears
  stored_task_label: presented_concept/piano
  post-task_response: 'Which topic best fits: water, fire, dog, piano, or other?'
  expected_answer_or_ground_truth: piano
  stimulus: 'Variant A: A piano stands beside the window in a quiet room. The player lifts the lid, sits
    on the bench, and presses three nearby keys in sequence. Variant B: The pianist opens a thin book
    on the music stand. One hand rests above the white keys while the other begins a short, evenly spaced
    melody.'
  protocol_note: ''
- id: T13
  title: Literal text comprehension
  module: B
  module_name: Reading and text controls
  type_task_duration: text / 12 s
  participant_instruction: Read silently and remember the sequence of events
  stored_task_label: reading_task/literal_comprehension
  post-task_response: Where is the notebook at the end?
  expected_answer_or_ground_truth: upper drawer
  stimulus: Nora puts a blue notebook on the desk and a red folder on the chair. Before leaving, she moves
    the notebook into the upper drawer.
  protocol_note: Do not reveal this question or the answer during the reading interval.
- id: T14
  title: Simple text inference
  module: B
  module_name: Reading and text controls
  type_task_duration: text / 12 s
  participant_instruction: Read silently and consider what probably happened
  stored_task_label: reading_task/inference
  post-task_response: What most likely happened to the ice cube?
  expected_answer_or_ground_truth: It melted
  stimulus: Mara leaves an ice cube in a shallow bowl on the kitchen table. An hour later the bowl contains
    a small pool of water and no solid ice.
  protocol_note: Accept equivalent wording. This is an inference task; its demand must be measured by
    performance and self-report.
- id: T15
  title: Text with negation
  module: B
  module_name: Reading and text controls
  type_task_duration: text / 12 s
  participant_instruction: Read silently, paying attention to where the object actually is
  stored_task_label: reading_task/negation
  post-task_response: Where are the keys?
  expected_answer_or_ground_truth: blue box beside the lamp
  stimulus: The keys are not inside the drawer, and they are not under the chair. They are in the blue
    box beside the lamp.
  protocol_note: Store the actual answer rather than treating every completed trial as successful comprehension.
- id: T16
  title: Reading command words control
  module: B
  module_name: Reading and text controls
  type_task_duration: sequence / 8 s
  participant_instruction: Read each word silently as ordinary text. Do not deliberately issue a command
    to the agent
  stored_task_label: control/command_word_reading
  post-task_response: Were you just reading, or did you also deliberately intend a command?
  expected_answer_or_ground_truth: No objective answer; record reading_only, command_also, or not_sure
  stimulus: Show YES, NO, YES, NO centrally, one word for 2 s each, with identical font and background.
  protocol_note: Exclude command_also trials from the clean reading control. This helps expose cue or
    word-reading contamination of command decoding.
- id: T17
  title: 'Observe an image: water'
  module: C
  module_name: Images
  type_task_duration: image / 8 s
  participant_instruction: Look at the image naturally without speaking or deliberately issuing a command
  stored_task_label: presented_concept/water
  post-task_response: 'Which topic best fits: water, fire, dog, piano, or other?'
  expected_answer_or_ground_truth: water
  assets: IMG_WATER_A
  stimulus: Show IMG_WATER_A only.
  protocol_note: Record the identification answer and common ratings. Image category alone does not establish
    internal meaning or preference.
