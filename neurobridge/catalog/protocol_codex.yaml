- id: T33
  title: 'Text-image agreement: water / water'
  module: E
  module_name: Meaning across modalities
  type_task_duration: text_image / 8 s
  participant_instruction: Read the sentence and inspect the image. Decide whether their main topics agree
  stored_task_label: cross_modal_agreement/match
  post-task_response: 'Do the main topics match: yes, no, or unsure?'
  expected_answer_or_ground_truth: 'yes'
  assets: IMG_WATER_A
  stimulus: 'Display IMG_WATER_A and this sentence together: A stream of water moves around the stones.'
  protocol_note: Show the sentence in the same position on all four cards. These repeated pairs can be
    memorized; success alone does not demonstrate general semantic decoding.
