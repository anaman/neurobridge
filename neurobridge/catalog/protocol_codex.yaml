- id: T41
  title: Single-step mental arithmetic
  module: F
  module_name: Task demand and memory
  type_task_duration: text / 12 s
  participant_instruction: Calculate silently; keep the answer in mind until the response prompt
  stored_task_label: task_demand/arithmetic_single_step
  post-task_response: What is the answer?
  expected_answer_or_ground_truth: '15'
  stimulus: Add 7 and 8.
  protocol_note: For repeat trials, use fresh one-digit additions. Precompute and lock answers. Pair session
    counts with T42; compare effort and accuracy, not just instructed difficulty.
