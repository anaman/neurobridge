  protocol_note: 'Freeze the classifier and thresholds first. These remain cued trials. Evaluate uncued
    free choice and idle periods separately before claiming voluntary control. ## 7. Repetition, randomization,
    and progression The following is a **starting collection budget**, not a statistical power calculation
    or a promise of sufficient training data. At roughly 16-24 trials per session, spread it across several
    weeks according to comfort. Start with a short pilot and reduce scope if recording quality or task
    performance is poor. | Phase | Items | Initial repetition plan | Planned trials | |---|---|---|---:|
    | Hardware/artifact check | T01-T08 | Once each; repeat a failed check after correcting setup | 8
    | | Broad discovery | T09-T48 | Four trials per item, spread across at least four days | 160 | | Cued
    intention discovery | T49-T55 | Twenty trials per item, spread across at least four days | 140 | |
    Uncued-choice exploration | T56 | Twenty trials, spread across those days | 20 | | Locked new-material
    evaluation | T57-T64 | Eight trials per item, split across at least two later days | 64 | | Locked
    idle-command evaluation | T55, now assigned to test sessions | Sixteen additional no-command trials
    on later days | 16 | | **Total initial plan** | **64 distinct test types** | Additional daily baselines
    and repeats are outside this total | **408** | Pilot recordings may enter the development dataset
    only if the final protocol and preprocessing rules were already in force. If instructions, stimuli,
    or labeling rules changed, keep the pilot separate. Never turn a failed held-out evaluation into training
    while still calling the same recordings a holdout. For four development days, a simple split is days
    1-3 for fitting and grouped cross-validation, day 4 for validation and threshold selection. Reserve
    the two later days for final testing. With so few independent days, confidence about generalization
    will be limited regardless of trial count. Add further development days if the model or thresholds
    are unstable; do not solve this by splitting adjacent windows randomly. [R8] Within each day, distribute
    classes across early and late session positions. Mix tasks within compatible presentation blocks;
    do not collect all YES trials first and all NO trials later. Use a saved random seed, equal planned
    counts for paired comparisons, and no more than three identical target labels consecutively where
    feasible. Do not imply that repeating a deterministic text creates a new independent semantic example.
    Use separate short blocks for text, images, and audio if setup requires it, but balance their order
    across days. Mix YES, NO, MORE, PAUSE, and rest within command blocks. For primary YES/NO/no-command
    analyses, T49+T51 and T50+T52 provide more trials than T55; collect extra development T55 trials or
    use training-only class weighting. Report the actual counts rather than silently presenting an imbalanced
    set as balanced. Take a 2-3 minute break after approximately 12 trials, or sooner when needed. Repeat
    a 60 s eyes-open baseline after repositioning the headband. A session ends when fatigue, discomfort,
    repeated artifact, or signal loss makes the labels unreliable.'
