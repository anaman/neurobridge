id: T606
slug: nature_vs_urban_soundscapes
tier: 6
title: "Nature vs urban soundscapes"
modality: [audio]
feasibility: promising
goal: >
  Compare sustained nature soundscapes with urban soundscapes at the same
  loudness and see whether frontal alpha/beta and 1/f shape separate them
  (nature is expected to be more restorative, urban more alerting). The decoded
  label is published as a `state` the agent can mirror in its own pacing.
classes: [nature, urban]
stimuli:
  source: freesound
  kind: audio
  queries:
    nature: ["nature soundscape forest birds", "noise_pink"]
    urban: ["city street traffic ambience", "noise_brown"]
  n_per_class: 4
  duration_s: 30.0
  license: ["cc0", "by"]
  fallback: synth
design:
  trials: 6
  duration_min: 14
  blocks: 3
  condition_duration_s: 120
  rest_between_blocks_s: 60
  break_duration_s: 60
markers:
  block_start: 1600
  block_end: 1601
  cue_onset: 1602
  break_start: 1603
  break_end: 1604
  nature: 1621
  urban: 1622
  stim_onset: 1650
processing:
  fs: 250
  epoching: windowed
  window_s: 4.0
  step_s: 1.0
  onset_markers: [stim_onset]
  bandpass: [0.5, 45.0]
  notch: [50.0, 60.0]
  artifact_ptp: 500000
  reject_policy: flag
features: [relbandpower:alpha, relbandpower:beta, ratio:beta_alpha, bandpower:theta, entropy:spectral, aperiodic:exponent]
decoder: {model: lda, cv: leave_one_block_out, normalize: zscore}
metrics: [balanced_accuracy, auc, permutation_p]
acceptance: {balanced_accuracy: 0.62, auc: 0.68}
risks:
  - "freesound 'nature' clips often contain music, speech or bird calls with speech-like envelopes, and 'urban' clips often contain sirens and voices; screen every clip and drop any that carries the other class's acoustics"
  - "both classes are broadband, so the effect can be nothing but loudness - normalise RMS to the same target and verify with bandpower:delta before trusting alpha/beta"
  - "urban clips are frequently annoying, so the class difference may be the T607 annoyance response rather than the restorative/alerting distinction"
  - "the offline synth fallback (noise_pink vs noise_brown) is a spectral tilt, not a soundscape; an offline run must be reported as degraded and not as evidence about soundscapes"
agent_use: state
notes: >
  Three blocks of 2 minutes nature and 2 minutes urban (30 s items, 60 s break
  between blocks). The second string in each query list is the offline synth
  generator name, so the test still runs without freesound (degraded). Match
  loudness across classes; if bandpower:delta separates the classes the clips
  are not level-matched. The runner emits stim_onset plus the class marker at
  each condition onset and windowed epoching labels each 4 s / 1 s window from
  the most recent class marker.
