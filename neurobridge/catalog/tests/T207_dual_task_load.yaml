id: T207
slug: dual_task_load
tier: 2
title: "Dual-task load"
modality: [multimodal]
feasibility: exploratory
goal: >
  Compare a single-task state (one continuous easy task) with a dual-task state
  (the same task plus a competing auditory stream). The question is whether the
  added coordination cost is visible at all on one dry frontal channel, above
  and beyond the extra effort of doing two things. The agent may use it as an
  exploratory `load` input only; the gate is deliberately near chance.
classes: [single, dual]
stimuli:
  source: mixed
  kind: audio
  queries:
    single: ["pseudo_speech"]
    dual: ["pseudo_speech", "noise_pink"]
  secondary_source: textbank
  secondary_queries:
    single: ["arithmetic_easy"]
    dual: ["arithmetic_hard"]
  n_per_class: 4
  duration_s: 60
  fallback: synth
design:
  trials: 8
  duration_min: 11
  blocks: 4
  soa_s: 60.0
  run_s: 60
  rest_between_blocks_s: 30
markers:
  block_start: 1200
  block_end: 1201
  break_start: 1202
  break_end: 1203
  cue_onset: 1204
  single: 1210
  dual: 1211
  stim_onset: 1250
processing:
  fs: 250
  epoching: windowed
  window_s: 4.0
  step_s: 1.0
  label_from: state
  bandpass: [0.3, 30]
  artifact_ptp: 400000
  reject_policy: flag
features:
  - "bandpower:theta"
  - "bandpower:alpha"
  - "ratio:theta_beta"
  - "relbandpower:beta"
  - "entropy:spectral"
  - "aperiodic:exponent"
decoder: {model: lda, cv: leave_one_block_out, normalize: zscore}
metrics: [balanced_accuracy, auc, permutation_p]
acceptance: {balanced_accuracy: 0.56, auc: 0.60}
risks:
  - "The two conditions are not equated for difficulty: the dual condition is difficult verbal arithmetic plus audio, the single condition is easy counting, so a decoder can win on arithmetic load alone and say nothing about dual-task coordination - which is exactly the confound this exploratory test cannot rule out."
  - "Two independent marker streams (text and audio) mean a late or dropped audio onset shifts the 4 s state boundary and mislabels the first window of a run; class markers must be written on the same clock as `stim_onset`."
  - "On one frontal channel, dual-task load and ordinary effort are not separable in principle: a positive result means 'something about this condition changed', and the report must state that ceiling rather than claiming a dual-task-specific signal."
notes: >
  Tier-2 sustained-state test, 4 blocks x (60 s single + 60 s dual), order ABBA,
  57 windows/class/block. Mixed source: the audio half is generated by `synth`
  from `queries` (pseudo-speech, plus pink noise in the dual runs) and the
  verbal half comes from the always-local `textbank` via `secondary_queries`
  (arithmetic_easy vs arithmetic_hard). Synthetic equivalent: single -> fake
  policy `load_low`, dual -> fake policy `load_high`.
agent_use: state
