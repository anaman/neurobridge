id: T406
slug: lexical_decision
tier: 4
title: "Lexical decision (word vs pseudoword)"
modality: [text]
feasibility: promising
goal: >
  Measure a frontal N400/P3 difference between real high-frequency words and
  legal pseudowords in a lexical decision task, giving the pipeline a coarse
  word-likeness signal. This is not a semantic decoder: it separates word from
  nonword, never one word from another.
classes: [word, pseudoword]
stimuli:
  source: textbank
  kind: text
  queries:
    word: words_high_freq
    pseudoword: pseudowords
  n_per_class: 120
  duration_s: 0.25
  fallback: textbank
design:
  trials: 200
  duration_min: 8
  blocks: 5
  soa_s: 1.5
  iti_jitter_s: [0.3, 0.6]
  rest_between_blocks_s: 30
markers:
  block_start: 1460
  block_end: 1461
  stim_onset: 1462
  cue_onset: 1463
  break_start: 1464
  break_end: 1465
  word: 1466
  pseudoword: 1467
  fixation_onset: 1469
  response: 1471
processing:
  fs: 250
  onset_markers: [stim_onset]
  bandpass: [0.3, 30]
  epoch: [-0.2, 0.8]
  baseline: [-0.2, 0.0]
  artifact_ptp: 400000
  reject_policy: reject
features: [erp:N400:300:500, erp:P3:250:450, bandpower:theta]
decoder: {model: lda, cv: leave_one_block_out, normalize: zscore}
metrics: [balanced_accuracy, auc, permutation_p]
acceptance: {balanced_accuracy: 0.63, auc: 0.68}
risks:
  - "At Fpz the lexicality effect is a small N400/LPC difference that competes on every trial with reading-related blink, eye-movement and jaw artifact."
  - "Pseudowords generated by the textbank may be phonotactically odd, so the subject could decide on orthographic unfamiliarity rather than lexical access, and a classifier would still pass while measuring the wrong thing."
  - "The button-press response adds frontal motor artifact; responses are recorded but must be excluded from features, and trials with a missed response must be flagged."
agent_use: none
notes: >
  100 trials per class, each word or pseudoword shown for 250 ms with a long,
  jittered ISI so the N400/LPC is not overlapped by the next stimulus. The
  hand used for the response must stay still between trials.
