id: T203
slug: stroop_colour_word
tier: 2
title: "Stroop colour-word interference"
modality: [text]
feasibility: promising
goal: >
  Hold the subject in congruent (word matches ink colour) and incongruent
  (word names a different colour) colour-word runs and expose the extra frontal
  midline theta / reduced alpha that conflict monitoring adds. The agent uses it
  as a coarse `load`/conflict state, never as a readout of the word shown.
classes: [congruent, incongruent]
stimuli:
  source: textbank
  kind: text
  queries:
    congruent: ["stroop_congruent"]
    incongruent: ["stroop_incongruent"]
  n_per_class: 40
  duration_s: 1.5
  fallback: textbank
design:
  trials: 160
  duration_min: 11
  blocks: 4
  soa_s: 3.0
  run_s: 60
  rest_between_blocks_s: 30
markers:
  block_start: 1200
  block_end: 1201
  break_start: 1202
  break_end: 1203
  cue_onset: 1204
  response_prompt: 1205
  congruent: 1210
  incongruent: 1211
  stim_onset: 1250
processing:
  fs: 250
  epoching: windowed
  window_s: 4.0
  step_s: 1.0
  label_from: state
  bandpass: [0.3, 30]
  artifact_ptp: 400000
  reject_policy: flag
features:
  - "bandpower:theta"
  - "bandpower:alpha"
  - "ratio:theta_beta"
  - "relbandpower:beta"
  - "entropy:spectral"
  - "aperiodic:exponent"
decoder: {model: lda, cv: leave_one_block_out, normalize: zscore}
metrics: [balanced_accuracy, auc, permutation_p]
acceptance: {balanced_accuracy: 0.60, auc: 0.65}
risks:
  - "The Stroop effect at Fpz is a small frontal-midline theta increase (a few percent), while pressing the response key recruits facial muscle 10-100x larger; a slight jaw clench in the incongruent blocks will carry the decoder by itself."
  - "Task automatisation: by block 3 the subject reads the colour word fluently and conflict drops, so a decoder trained on block 1 may not transfer - leave_one_block_out will expose this as fold variance."
  - "1 s window steps over a 60 s run give 57 windows per class per block, but adjacent windows share 3 of 4 s of data, so the effective sample size is roughly a seventh of the nominal 228 and the permutation p-value is optimistic."
notes: >
  Tier-2 sustained-state test, 4 blocks x (60 s congruent + 60 s incongruent),
  order ABBA, 57 windows/class/block. `response_prompt` (1205) marks the key
  window and `stim_onset` (1250) each word; labels come from the run-onset class
  markers. Synthetic equivalent: congruent -> fake policy `load_low`,
  incongruent -> fake policy `load_high`.
agent_use: state
