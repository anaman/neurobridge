id: T204
slug: visual_search_easy_vs_hard
tier: 2
title: "Visual search, easy vs hard"
modality: [image]
feasibility: promising
goal: >
  Contrast sustained easy visual search (target differs from a few distractors
  by one salient feature) with hard search (target shares features with a dense
  distractor field, so it must be bound serially). The expected state is lower
  alpha and higher beta/theta ratio in hard search; the agent reads it as
  `load`/effort, not as the identity of the image.
classes: [easy, hard]
stimuli:
  source: openverse
  kind: image
  queries:
    easy: ["single bright geometric shape on a plain background"]
    hard: ["dense crowd of similar objects, cluttered scene"]
  n_per_class: 30
  duration_s: 2.0
  license: ["cc0", "by"]
  fallback: builtin
design:
  trials: 240
  duration_min: 11
  blocks: 4
  soa_s: 2.0
  run_s: 60
  rest_between_blocks_s: 30
markers:
  block_start: 1200
  block_end: 1201
  break_start: 1202
  break_end: 1203
  cue_onset: 1204
  response_prompt: 1205
  easy: 1210
  hard: 1211
  stim_onset: 1250
processing:
  fs: 250
  epoching: windowed
  window_s: 4.0
  step_s: 1.0
  label_from: state
  bandpass: [0.3, 30]
  artifact_ptp: 400000
  reject_policy: flag
features:
  - "bandpower:theta"
  - "bandpower:alpha"
  - "bandpower:high_beta"
  - "ratio:theta_beta"
  - "relbandpower:beta"
  - "entropy:spectral"
  - "aperiodic:exponent"
decoder: {model: lda, cv: leave_one_block_out, normalize: zscore}
metrics: [balanced_accuracy, auc, permutation_p]
acceptance: {balanced_accuracy: 0.60, auc: 0.65}
risks:
  - "Openverse easy and hard sets differ in luminance, contrast and spatial frequency as well as search load; luminance drives visual-cortex alpha through the visual pathway and at Fpz that confound can be the decodable variable, so the two sets must be luminance-matched and only pair-wise matched sessions are interpretable."
  - "There is no eye tracker: hard search produces more saccades and more blinks, and a blink is ~260k counts at Fpz (about 10x EEG); flagged windows will pile up in the hard condition and bias the decoder even when reject_policy is flag rather than reject."
  - "If Openverse is unreachable the builtin procedural fallback runs instead, which is a much easier stimulus set; results from a fallback session must be reported as such and not compared with downloaded-image sessions."
notes: >
  Tier-2 sustained-state test, 4 blocks x (60 s easy + 60 s hard), order ABBA;
  30 images per class per run at 2 s each, 57 windows/class/block. `stim_onset`
  (1250) marks each image, class markers at run onset carry `state` meta.
  Fallback is `builtin` procedural images (categories bright/dark/object/...).
  Synthetic equivalent: easy -> fake policy `load_low`, hard -> fake policy
  `load_high`.
agent_use: state
