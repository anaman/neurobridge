id: T603
slug: consonant_vs_dissonant_chords
tier: 6
title: "Consonant vs dissonant chords"
modality: [audio]
feasibility: exploratory
goal: >
  Measure whether sustained consonant versus dissonant chord sequences produce a
  separable frontal band-power state (roughness is expected to raise beta and
  lower the aperiodic exponent) and publish the label as a `state` the agent can
  use to bias its own tone.
classes: [consonant, dissonant]
stimuli:
  source: synth
  kind: audio
  queries:
    consonant: ["chord_consonant"]
    dissonant: ["chord_dissonant"]
  n_per_class: 2
  duration_s: 30.0
  fallback: synth
design:
  trials: 6
  duration_min: 14
  blocks: 3
  condition_duration_s: 120
  rest_between_blocks_s: 60
  break_duration_s: 60
markers:
  block_start: 1600
  block_end: 1601
  cue_onset: 1602
  break_start: 1603
  break_end: 1604
  consonant: 1615
  dissonant: 1616
  stim_onset: 1650
processing:
  fs: 250
  epoching: windowed
  window_s: 4.0
  step_s: 1.0
  onset_markers: [stim_onset]
  bandpass: [0.5, 45.0]
  notch: [50.0, 60.0]
  artifact_ptp: 500000
  reject_policy: flag
features: [relbandpower:alpha, relbandpower:beta, ratio:beta_alpha, bandpower:theta, entropy:spectral, aperiodic:exponent]
decoder: {model: lda, cv: leave_one_block_out, normalize: zscore}
metrics: [balanced_accuracy, auc, permutation_p]
acceptance: {balanced_accuracy: 0.56, auc: 0.60}
risks:
  - "the two chord generators differ in more than roughness (spectral centroid, number of partials); unless they are matched in RMS, fundamental set and note length the decoder learns timbre, not consonance"
  - "sensory dissonance is carried by fast beating between adjacent partials over tens of milliseconds; a 4 s window averages it away, so the sustained band-power difference may be near zero"
  - "dissonant chords are aversive, so an above-chance result can be annoyance/arousal (the T607 mechanism) rather than a consonance-specific response"
  - "repeating one identical chord for 2 minutes invites habituation and mind-wandering, both of which move frontal alpha independently of the chord"
agent_use: state
notes: >
  Each condition is one chord sequence repeated for 2 minutes (30 s items, 3
  blocks) so every 4 s / 1 s window lies inside a single condition. The runner
  emits stim_onset and the class marker at each condition onset. The synth step
  must normalise both generators to the same target level (-23 dBFS); if
  bandpower:delta separates the classes, the clips are not level-matched and the
  run must be discarded.
